apiVersion: v1
kind: Service
metadata:
  name: n8n-admin
  namespace: n8n
  annotations:
    cloud.google.com/backend-config: '{"default": "n8n-admin-armor"}'
spec:
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/instance: n8n
  ports:
    - name: http
      port: 5678
      targetPort: http
      protocol: TCP
  type: ClusterIP
